# Hrizzup skills: the three image kits on a Linux machine (docs/design.md, 7.4). Started by hand from the
# Actions tab (or `gh workflow run kits-linux.yml`), and never one of the checks the "main" ruleset requires.
#
# It runs the timeline card, the meme and the infographic on the samples' own inputs, twice: once with
# `uv run --locked` (the lock beside each script) and once with plain pip from each script's hashed
# requirements file in a fresh virtual environment. Every picture is read back with the repository's own
# media reader, and kept as an artifact. The work is in tools/kits_run.py, which also runs on a Mac.
#
# GitHub starts a workflow_dispatch run only if the workflow file is on the default branch, so this can't
# be run from the pull request that adds it. No expression is used inside a script, so outside text can't
# reach one.

name: Kits on Linux

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kits:
    name: Image kits
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv (a release of astral-sh/setup-uv at least 3 days old, uv itself pinned)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.1"
          enable-cache: false

      - name: Install Python 3.12 with uv
        run: uv python install 3.12

      - name: Run the three kits on the samples' inputs, with uv and with plain pip, and check every picture
        run: python3 tools/kits_run.py --out out --mode both --python 3.12

      - name: Keep the pictures and the summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kits-linux
          path: out
          if-no-files-found: error
          retention-days: 14
